name: Release (app + firmware)

# One release per version: vX.Y.Z-oled-edition = firmware X.Y.Z + the
# DS5 Dongle OLED Edition Configurator app X.Y.Z, which bundles that firmware
# (offline first-time setup and updates). Started by tools/release.sh, which
# pushes the same tag to this repo and the app repo.
#
# Only these tags trigger it: other releases here (e.g. proton-*) are never
# touched. The release is created as a draft and published only once every
# file is attached, then latest.json (the apps' update feed) is refreshed.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-oled-edition"
      # Development builds (vX.Y.Z-dev.N-oled-edition): published as a
      # pre-release, offered only on the app's Development channel.
      - "v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+-oled-edition"
  # Dry run: everything a release builds, from master, on all three systems,
  # with the publish job's checks, but no tag, release, attestation or feed.
  # The builds are left as workflow artifacts (e.g. a Windows build to test).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as (X.Y.Z)"
        required: true
        default: "0.8.0"

env:
  # The release's tag, or the one a dry run pretends to build.
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}-oled-edition', inputs.version) }}
  # What to build from: the tag (both repos), or master for a dry run.
  SRC_REF: ${{ github.event_name == 'push' && github.ref_name || 'master' }}
  DRY_RUN: ${{ github.event_name != 'push' }}
  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
  APP_REPO: MarcelineVPQ/DS5Dongle-OLED-Config-Web
  NPM: npx -y npm@11.6.2
  # PICO_SDK_REF, TINYUSB_REF and ARM's own toolchain (ARM_TOOLCHAIN_VERSION /
  # _URL; not Ubuntu's gcc-arm-none-eabi, as upstream awalol 425061f) are pinned
  # in tools/toolchain.env, loaded by the first step after checkout.
  ARM_TOOLCHAIN_PATH: ${{ github.workspace }}/arm-toolchain
  APT_PACKAGES: >-
    cmake
    python3
    build-essential
    ninja-build

permissions:
  contents: write

jobs:
  # The boards a release ships: boards.json rows with release: true, one
  # firmware image each (design DESIGN_FIRMWARE_IDENTITY §5).
  boards:
    name: Release boards (boards.json)
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.rows.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - id: rows
        run: echo "ids=$(node -p 'JSON.stringify(require("./boards.json").boards.filter((b) => b.release).map((b) => b.id))')" >> "$GITHUB_OUTPUT"

  firmware:
    name: Build firmware (${{ matrix.board }})
    needs: boards
    strategy:
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.ids) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
          submodules: recursive

      - name: Load toolchain pins
        run: grep -E '^[A-Z_]+=' tools/toolchain.env >> "$GITHUB_ENV"

      - name: Prepare build dependency cache
        id: apt-cache
        run: |
          mkdir -p "$RUNNER_TEMP/apt-cache/partial"
          . /etc/os-release
          package_hash="$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -d ' ' -f 1)"
          echo "dir=$RUNNER_TEMP/apt-cache" >> "$GITHUB_OUTPUT"
          echo "os=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "package-hash=$package_hash" >> "$GITHUB_OUTPUT"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.apt-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-apt-${{ steps.apt-cache.outputs.os }}-${{ steps.apt-cache.outputs.package-hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apt-${{ steps.apt-cache.outputs.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="${{ steps.apt-cache.outputs.dir }}" install --download-only -y $APT_PACKAGES
          sudo apt-get -o Dir::Cache::archives="${{ steps.apt-cache.outputs.dir }}" install -y $APT_PACKAGES
          sudo chmod -R a+rX "${{ steps.apt-cache.outputs.dir }}"

      - name: Cache ARM toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-arm-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Download ARM toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_PATH"
          curl -fsSL "$ARM_TOOLCHAIN_URL" | tar -xJ -C "$ARM_TOOLCHAIN_PATH" --strip-components=1

      - name: Add ARM toolchain to PATH
        run: |
          echo "$ARM_TOOLCHAIN_PATH/bin" >> "$GITHUB_PATH"
          "$ARM_TOOLCHAIN_PATH/bin/arm-none-eabi-gcc" --version

      - name: Cache Pico SDK
        id: cache-pico-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.PICO_SDK_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pico-sdk-${{ env.PICO_SDK_REF }}-tinyusb-${{ env.TINYUSB_REF }}

      - name: Download Pico SDK
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_REF" https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --recursive

      - name: Switch TinyUSB to the pinned commit
        run: |
          tusb="$PICO_SDK_PATH/lib/tinyusb"
          if git -C "$tusb" cat-file -e "$TINYUSB_REF^{commit}" 2>/dev/null; then
            git -C "$tusb" checkout --detach "$TINYUSB_REF"
          else
            git -C "$tusb" fetch --depth 1 origin "$TINYUSB_REF"
            git -C "$tusb" checkout --detach FETCH_HEAD
          fi
          git -C "$tusb" log -1 --format='TinyUSB %H %s'

      - name: lib/* stay submodule gitlinks
        run: tools/check_gitlinks.sh

      - name: The 7 READMEs match README.md (CLAUDE.md "Releases")
        run: python3 tools/check_readmes.py

      - name: The community files are present (CLAUDE.md "Community files")
        run: python3 tools/check_community.py

      - name: Every loop has a verdict (CLAUDE.md "Loop pass")
        run: python3 tools/list_loops.py --check

      - name: Every failure path has a verdict (CLAUDE.md "Error pass")
        run: python3 tools/list_errors.py --check
      - name: Every acquisition has a verdict (CLAUDE.md "Lifetime pass")
        run: python3 tools/list_lifetimes.py --check

      - name: Host unit tests (ASan + UBSan)
        run: tests/host/run.sh build/host-tests

      # The board's image under its boards.json asset name, the image checks,
      # its firmware-image-<board>.json and gate G2 (tools/build_board.sh).
      - name: Build release firmware (with the configurator interface)
        run: tools/build_board.sh "${{ matrix.board }}" "$TAG" -DENABLE_COMPANION_VENDOR=ON

      # What the app bundles: the Pico 2 W image plus its version and hash.
      - name: Bundle for the app
        if: matrix.board == 'pico2_w'
        run: |
          mkdir -p bundle
          cp build/pico2_w/ds5-bridge-oled.uf2 bundle/ds5-bridge-oled.uf2
          printf '{"version":"%s","board":"%s","file":"ds5-bridge-oled.uf2","sha256":"%s"}\n' "$TAG" "${{ matrix.board }}" "$(sha256sum bundle/ds5-bridge-oled.uf2 | cut -d' ' -f1)" > bundle/firmware.json
          # The app builds this release's firmware CHANGELOG.md into About →
          # Firmware changes (its firmwareChangelog.config.ts), so that tab needs no network.
          cp CHANGELOG.md bundle/CHANGELOG.md

      # The debug build (ENABLE_SERIAL=ON) comes up as a serial console, not a
      # working bridge: a developer diagnostic, never a release download.
      # Boards with release: false (the Pico W) stay CI artifacts (build.yml).

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release-${{ matrix.board }}
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: matrix.board == 'pico2_w'
        with:
          name: firmware-bundle
          path: bundle/

  app:
    name: Build app (${{ matrix.os }})
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the app at the same tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.SRC_REF }}
      - name: Bundle this release's firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-bundle
          path: resources/firmware
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ${{ env.NPM }} ci
        shell: bash
      - name: Version check (app version must match the tag)
        shell: bash
        run: |
          want="${TAG#v}"; want="${want%-oled-edition}"
          # A dry run builds master as that version; a release must match.
          if [ "$DRY_RUN" = "true" ]; then npm pkg set version="$want"; fi
          have="$(node -p 'require("./package.json").version')"
          [ "$want" = "$have" ] || { echo "app package.json is $have, tag wants $want"; exit 1; }
      - name: Tests must pass before anything ships
        run: npx vitest run
        shell: bash
        env:
          DS5_REQUIRE_FIRMWARE_CHANGELOG: "1"
      - name: Build
        run: npx electron-vite build && npx electron-builder ${{ matrix.target }} --publish never
        shell: bash
        env:
          # Fail rather than ship the "no firmware changelog in this build" note.
          DS5_REQUIRE_FIRMWARE_CHANGELOG: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*-win-x64*.exe
            release/*-mac-universal.zip
          if-no-files-found: error

  publish:
    # On a dry run only the checks below run (nothing is published).
    name: Publish the release
    needs: [firmware, app]
    runs-on: ubuntu-latest
    # Build provenance: each file gets a signed attestation that it was built
    # by this workflow from this tag (gh attestation verify FILE -R this repo).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - name: App changelog
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.SRC_REF }}
          path: app
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One list of every board image (each build job wrote its own row after
      # gate G2), for tools/build_manifest.mjs; then G2 again on each UF2
      # against the merged list.
      - name: firmware-images.json
        run: |
          set -euo pipefail
          node -e 'const fs = require("fs"); const rows = fs.readdirSync("dist").filter((f) => /^firmware-image-.+\.json$/.test(f)).sort().flatMap((f) => JSON.parse(fs.readFileSync("dist/" + f, "utf8")));
            fs.writeFileSync("dist/firmware-images.json", JSON.stringify(rows, null, 2) + "\n");'
          cat dist/firmware-images.json
          node -p 'require("./dist/firmware-images.json").map((e) => e.board + " " + e.file).join("\n")' | while read -r board file; do
            node tools/uf2_info.mjs "dist/$file" --board "$board" --version "$TAG" --images dist/firmware-images.json </dev/null || exit 1
          done
      - name: Checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.AppImage dist/*-win-x64*.exe dist/*-mac-universal.zip dist/ds5-bridge-oled-*.uf2)
          want=$((3 + $(node -p 'require("./boards.json").boards.filter((b) => b.release).length')))
          [ "${#files[@]}" -eq "$want" ] || { echo "expected $want files (3 apps + one UF2 per release board), got: ${files[*]}"; exit 1; }
          ( cd dist && sha256sum "${files[@]##*/}" firmware-images.json > SHA256SUMS.txt && cat SHA256SUMS.txt )
      # Build provenance, before the release is visible: a signed attestation
      # per file that this workflow built it from this tag.
      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*-win-x64*.exe
            dist/*-mac-universal.zip
            dist/ds5-bridge-oled-*.uf2
            dist/firmware-images.json
            dist/SHA256SUMS.txt
      - name: Notes, draft release, publish when complete
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$TAG"; fw="${tag#v}"; app="${fw%-oled-edition}"
          # A release name (tools/release.sh --label): "## [fw] — Release Candidate 1 — date".
          label="$(sed -n "s/^## \[$fw\] — \(.*\) — [0-9-]*\$/\1/p" CHANGELOG.md | head -n 1)"
          section() { awk -v v="$2" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' "$1"; }
          dev=false; case "$app" in *-dev.*) dev=true ;; esac
          app_section="$app"
          # A development build's notes are its own sections ([X.Y.Z-dev.N-oled-edition]
          # here, [X.Y.Z-dev.N] in the app; tools/release.sh cuts them from [Unreleased]).
          # A dev tag made without those sections falls back to [Unreleased].
          if [ "$dev" = true ]; then
            grep -q "^## \[$fw\]" CHANGELOG.md || fw=Unreleased
            grep -q "^## \[$app_section\]" app/CHANGELOG.md || app_section=Unreleased
          fi
          {
            echo "**Download the app for your system below.** It includes this firmware and installs it on your Raspberry Pi Pico 2 W with one click (a brand-new one too)."
            echo
            # Windows 11 counts as tested for a stable release, and for a
            # development build only when its annotated tag says so: a line
            # "Windows-checked: yes" (the Windows VM check ran on this build).
            win_checked=true
            if [ "$dev" = true ]; then
              win_checked=false
              ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' || true)"
              if [ "${ref%% *}" = tag ] && gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .message | grep -qi '^Windows-checked: yes'; then
                win_checked=true
              fi
            fi
            # macOS counts as tested only when this tag's macOS smoke test passed:
            # the app repo's mac-smoke.yml, started by the same tag push
            # (tools/release.sh), installs this tag's universal app on a real
            # Apple Silicon Mac and drives it. Its run for this tag and this app
            # commit is read here (public repo: this job's token reads it, no
            # secret), waiting while it is still running. Not found, failed,
            # cancelled or still running after the wait: no macOS claim.
            mac_checked=false
            app_sha="$(git -C app rev-parse HEAD)"
            # Up to 50 minutes (mac-smoke's own limit is 45); a run that never
            # shows up stops the wait after 10.
            run=""; seen=false
            for i in $(seq 1 100); do
              run="$(gh run list -R "$APP_REPO" --workflow mac-smoke.yml --event push --branch "$tag" --commit "$app_sha" -L 1 --json status,conclusion --jq '.[0] | select(.) | .status + " " + (.conclusion // "")' || true)"
              case "$run" in
                "completed success") mac_checked=true; break ;;
                completed*) break ;;
                "") if [ "$seen" = true ] || [ "$i" -ge 20 ]; then break; fi ;;
                *) seen=true ;;
              esac
              sleep 30
            done
            echo "macOS smoke test for $tag (app $app_sha): ${run:-no run found}" >&2
            linux="Linux (the AppImage)"
            win="Windows 11 (the installer, which needs no admin rights)"
            mac="macOS (the universal app, installed and run on a real Apple Silicon Mac by the macOS smoke test)"
            win_skipped="The Windows 11 installer (no admin rights needed) comes from the same workflow and passes the same automated tests on Windows; this development build skipped the hands-on check in the Windows 11 test VM."
            case "$win_checked $mac_checked" in
              "true true") echo "Tested on $linux, $win and $mac. The Games page is on Linux and Windows." ;;
              "true false") echo "Tested on $linux and $win. The Games page is on Linux and Windows." ;;
              "false true") echo "Tested on $linux and $mac. $win_skipped The Games page is on Linux and Windows." ;;
              *) echo "Tested on $linux. $win_skipped The Games page is on Linux and Windows." ;;
            esac
            echo
            section CHANGELOG.md "$fw"
            echo
            echo "## Configurator app $app"
            section app/CHANGELOG.md "$app_section"
          } > notes.md
          files=(dist/*.AppImage dist/*-win-x64*.exe dist/*-mac-universal.zip dist/ds5-bridge-oled-*.uf2)
          {
            echo
            echo "**Verify a download** (optional): \`gh attestation verify FILE -R ${GITHUB_REPOSITORY}\` shows it was built by this repository's release workflow from this tag."
          } >> notes.md
          if [ "$dev" = true ]; then
            {
              echo
              echo "**This is a development build**: newer than the stable release, with the same automated tests on every change; stable releases also get the full release checks on real hardware and Windows, plus time in everyday use. The app offers it only on App settings -> Updates -> Development; **Back to stable** there returns to the latest stable app and firmware."
            } >> notes.md
          fi
          gh release create "$tag" --draft --verify-tag $([ "$dev" = true ] && echo --prerelease) --title "${tag%-oled-edition}${label:+ — $label} — OLED Edition" --notes-file notes.md
          gh release upload "$tag" "${files[@]}" dist/firmware-images.json dist/SHA256SUMS.txt
          if [ "$dev" = true ]; then gh release edit "$tag" --draft=false; else gh release edit "$tag" --draft=false --latest; fi
