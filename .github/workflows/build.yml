name: Build firmware

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
  # PICO_SDK_REF, TINYUSB_REF and ARM's own toolchain (ARM_TOOLCHAIN_VERSION /
  # _URL; not Ubuntu's gcc-arm-none-eabi, as upstream awalol 425061f) are pinned
  # in tools/toolchain.env, loaded by the first step after checkout.
  ARM_TOOLCHAIN_PATH: ${{ github.workspace }}/arm-toolchain
  APT_PACKAGES: >-
    cmake
    python3
    build-essential
    ninja-build

jobs:
  build:
    name: Build UF2 artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load toolchain pins
        run: grep -E '^[A-Z_]+=' tools/toolchain.env >> "$GITHUB_ENV"

      - name: Set firmware version
        run: printf 'FIRMWARE_VERSION=%s\n' "${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Prepare build dependency cache
        id: apt-cache
        run: |
          mkdir -p "$RUNNER_TEMP/apt-cache/partial"
          . /etc/os-release
          package_hash="$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -d ' ' -f 1)"
          echo "dir=$RUNNER_TEMP/apt-cache" >> "$GITHUB_OUTPUT"
          echo "os=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "package-hash=$package_hash" >> "$GITHUB_OUTPUT"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.apt-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-apt-${{ steps.apt-cache.outputs.os }}-${{ steps.apt-cache.outputs.package-hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-apt-${{ steps.apt-cache.outputs.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="${{ steps.apt-cache.outputs.dir }}" install --download-only -y $APT_PACKAGES
          sudo apt-get -o Dir::Cache::archives="${{ steps.apt-cache.outputs.dir }}" install -y $APT_PACKAGES
          sudo chmod -R a+rX "${{ steps.apt-cache.outputs.dir }}"

      - name: Cache ARM toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-arm-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Download ARM toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_PATH"
          curl -fsSL "$ARM_TOOLCHAIN_URL" | tar -xJ -C "$ARM_TOOLCHAIN_PATH" --strip-components=1

      - name: Add ARM toolchain to PATH
        run: |
          echo "$ARM_TOOLCHAIN_PATH/bin" >> "$GITHUB_PATH"
          "$ARM_TOOLCHAIN_PATH/bin/arm-none-eabi-gcc" --version

      - name: Cache Pico SDK
        id: cache-pico-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.PICO_SDK_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pico-sdk-${{ env.PICO_SDK_REF }}-tinyusb-${{ env.TINYUSB_REF }}

      - name: Download Pico SDK
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_REF" https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --recursive

      - name: Switch TinyUSB to the pinned commit
        run: |
          tusb="$PICO_SDK_PATH/lib/tinyusb"
          if git -C "$tusb" cat-file -e "$TINYUSB_REF^{commit}" 2>/dev/null; then
            git -C "$tusb" checkout --detach "$TINYUSB_REF"
          else
            git -C "$tusb" fetch --depth 1 origin "$TINYUSB_REF"
            git -C "$tusb" checkout --detach FETCH_HEAD
          fi
          git -C "$tusb" log -1 --format='TinyUSB %H %s'

      - name: lib/* stay submodule gitlinks
        run: tools/check_gitlinks.sh

      - name: The 7 READMEs match README.md (CLAUDE.md "Releases")
        run: python3 tools/check_readmes.py

      - name: Every loop has a verdict (CLAUDE.md "Loop pass")
        run: python3 tools/list_loops.py --check

      - name: Every failure path has a verdict (CLAUDE.md "Error pass")
        run: python3 tools/list_errors.py --check
      - name: Every acquisition has a verdict (CLAUDE.md "Lifetime pass")
        run: python3 tools/list_lifetimes.py --check

      - name: Host unit tests (ASan + UBSan)
        run: tests/host/run.sh build/host-tests

      - name: Build standard firmware
        run: |
          cmake -S . -B build/standard -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DVERSION="$FIRMWARE_VERSION"
          cmake --build build/standard --target ds5-bridge
          tools/check_ram_residency.sh build/standard/ds5-bridge-oled.elf
          tools/check_xip_setup.sh build/standard/ds5-bridge-oled.elf 2 11
          mkdir -p artifacts
          cp build/standard/ds5-bridge-oled.uf2 artifacts/ds5-bridge-oled.uf2

      - name: Build Debug firmware
        run: |
          cmake -S . -B build/debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DENABLE_SERIAL=ON \
            -DENABLE_VERBOSE=ON \
            -DVERSION="$FIRMWARE_VERSION"
          cmake --build build/debug --target ds5-bridge
          cp build/debug/ds5-bridge-oled.uf2 artifacts/ds5-bridge-oled-debug.uf2

      - name: Build no-batt-led firmware (compile check only)
        run: |
          cmake -S . -B build/no-batt-led -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DENABLE_BATT_LED=OFF \
            -DVERSION="$FIRMWARE_VERSION"
          cmake --build build/no-batt-led --target ds5-bridge

      # The old 320 MHz overclock, kept buildable for one release as a fallback
      # (CMakeLists.txt DS5_CLOCK_KHZ); remove with the option.
      - name: Build 320 MHz fallback firmware (compile check only)
        run: |
          cmake -S . -B build/oc320 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DDS5_CLOCK_KHZ=320000 \
            -DVERSION="$FIRMWARE_VERSION"
          cmake --build build/oc320 --target ds5-bridge
          tools/check_xip_setup.sh build/oc320/ds5-bridge-oled.elf 4 13

      - name: Build Pico W firmware
        run: |
          cmake -S . -B build/picow -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            -DPICO_W_BUILD=ON \
            -DVERSION="$FIRMWARE_VERSION"
          cmake --build build/picow --target ds5-bridge
          tools/check_ram_residency.sh build/picow/ds5-bridge-oled.elf
          tools/check_xip_setup.sh build/picow/ds5-bridge-oled.elf
          cp build/picow/ds5-bridge-oled.uf2 artifacts/ds5-bridge-oled-picow.uf2

      - name: Upload standard UF2 artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ds5-bridge-oled.uf2
          archive: false
          if-no-files-found: error

      - name: Upload Debug UF2 artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ds5-bridge-oled-debug.uf2
          archive: false
          if-no-files-found: error

      - name: Upload PicoW UF2 artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ds5-bridge-oled-picow.uf2
          archive: false
          if-no-files-found: error
